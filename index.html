<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d631b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/brand/gyansetu-logo.webp" />
    <title>Gyan Setu</title>

    <!--
      Splash screen — inlined so it paints before any JS module loads (no
      flash of blank white). Colors are hardcoded rather than pulled from
      theme.css because that stylesheet is imported via main.jsx and isn't
      guaranteed to be parsed by the time this first paints; this is
      deliberately a fixed brand moment, not a light/dark-aware surface, so
      that's fine. Removed by the script at the bottom of <body> once the
      app signals it has mounted (see MainLayout.jsx's `gs:app-ready`
      dispatch).
    -->
    <style>
      #gs-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 42%, #1c7a2c 0%, #0d631b 45%, #062a0c 100%);
        overflow: hidden;
      }

      #gs-splash.is-exiting {
        pointer-events: none;
      }

      .gs-splash__stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        padding: 0 1.5rem;
        text-align: center;
      }

      .gs-splash__rings {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1px;
        height: 1px;
      }

      .gs-splash__rings span {
        position: absolute;
        top: 0;
        left: 0;
        width: 132px;
        height: 132px;
        margin: -66px 0 0 -66px;
        border-radius: 50%;
        border: 1.5px solid rgba(163, 246, 156, 0.55);
        opacity: 0;
      }

      .gs-splash__logo-wrap {
        position: relative;
        width: 116px;
        height: 116px;
      }

      .gs-splash__logo {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.35));
        opacity: 0;
      }

      .gs-splash__word {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 0.09em;
        color: #f5fcec;
        opacity: 0;
      }

      .gs-splash__tagline {
        font-family: "Source Sans 3", system-ui, sans-serif;
        font-size: 0.9rem;
        color: rgba(245, 252, 236, 0.78);
        opacity: 0;
      }

      .gs-splash__dots {
        display: flex;
        gap: 6px;
        height: 8px;
        margin-top: 0.35rem;
        opacity: 0;
      }

      .gs-splash__dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffb231;
      }

      /* Entrance choreography — gated behind no-preference so a
         reduced-motion visitor never has content hidden-then-revealed;
         they get the resting, fully-visible state immediately instead. */
      @media (prefers-reduced-motion: no-preference) {
        .gs-splash__rings span {
          animation: gs-splash-ring 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .gs-splash__rings span:nth-child(2) { animation-delay: 0.55s; }
        .gs-splash__rings span:nth-child(3) { animation-delay: 1.1s; }

        .gs-splash__logo {
          animation: gs-splash-logo-in 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .gs-splash__word {
          animation: gs-splash-rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
        }

        .gs-splash__tagline {
          animation: gs-splash-rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.75s both;
        }

        .gs-splash__dots {
          animation: gs-splash-rise-in 0.5s ease 0.95s both;
        }

        .gs-splash__dots span {
          animation: gs-splash-dot-bounce 1.1s ease-in-out infinite;
        }
        .gs-splash__dots span:nth-child(2) { animation-delay: 0.15s; }
        .gs-splash__dots span:nth-child(3) { animation-delay: 0.3s; }

        #gs-splash.is-exiting {
          animation: gs-splash-exit 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
      }

      /* Without motion: everything just sits in its resting, visible state
         and the exit is a plain instant removal (handled in JS below). */
      @media (prefers-reduced-motion: reduce) {
        .gs-splash__rings { display: none; }
        .gs-splash__logo,
        .gs-splash__word,
        .gs-splash__tagline,
        .gs-splash__dots {
          opacity: 1;
        }
      }

      @keyframes gs-splash-ring {
        0% { transform: scale(0.6); opacity: 0.6; }
        100% { transform: scale(2.6); opacity: 0; }
      }

      @keyframes gs-splash-logo-in {
        0% { opacity: 0; transform: scale(0.4) rotate(-12deg); filter: blur(10px); }
        22% { opacity: 1; transform: scale(1.08) rotate(3deg); filter: blur(0); }
        32% { transform: scale(1) rotate(0deg); }
        45%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }

      @keyframes gs-splash-rise-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }

      @keyframes gs-splash-dot-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-6px); opacity: 1; }
      }

      @keyframes gs-splash-exit {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="gs-splash" role="status" aria-label="Loading Gyan Setu">
      <div class="gs-splash__stage">
        <div class="gs-splash__rings" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="gs-splash__logo-wrap">
          <img class="gs-splash__logo" src="/brand/gyansetu-logo.webp" alt="" />
        </div>
        <div class="gs-splash__word">GYAN SETU</div>
        <div class="gs-splash__tagline">Your bridge to mathematical mastery</div>
        <div class="gs-splash__dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script>
      // Orchestrates the splash lifetime: waits for the app to signal
      // `gs:app-ready` (dispatched once MainLayout mounts) AND a minimum
      // display time (so the entrance animation never gets cut short on a
      // fast load), then plays the exit transition and removes the node —
      // a splash that lingers in the DOM after it's invisible would still
      // sit in the accessibility tree and eat a paint layer for nothing.
      (function () {
        var splash = document.getElementById("gs-splash");
        if (!splash) return;

        var reduceMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        // 1600ms comfortably covers the full entrance choreography: the logo
        // settles by ~830ms, the tagline finishes revealing at 1450ms, and
        // the dots at 1450ms too — this leaves a beat after everything has
        // landed before the exit fade begins.
        var MIN_MS = reduceMotion ? 150 : 1600;
        var MAX_MS = 4000; // safety net if the ready event never arrives
        var start = Date.now();
        var exited = false;

        function remove() {
          splash.remove();
        }

        function exit() {
          if (exited) return;
          exited = true;
          splash.classList.add("is-exiting");
          if (reduceMotion) {
            remove();
          } else {
            splash.addEventListener("animationend", remove, { once: true });
            setTimeout(remove, 700); // in case animationend never fires
          }
        }

        function onReady() {
          setTimeout(exit, Math.max(MIN_MS - (Date.now() - start), 0));
        }

        window.addEventListener("gs:app-ready", onReady, { once: true });
        setTimeout(exit, MAX_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
